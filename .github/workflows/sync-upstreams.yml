name: 同步上游源码

# 每 6 小时自动同步一次上游仓库 -> mirror/
# 也可以到 Actions 页面点「Run workflow」手动触发
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstreams
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 镜像上游源码到 mirror/
        run: bash .github/scripts/sync-upstreams.sh

      - name: 提交并推送（有变化才提交）
        run: |
          git config user.name  "sakura-sync-bot"
          git config user.email "sakura-sync-bot@users.noreply.github.com"

          if [ -z "$(git status --porcelain)" ]; then
            echo "上游无变化，跳过提交"
            exit 0
          fi

          git add -A
          git commit -m "sync: 同步上游源码包 [skip ci] $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push