# 上游源码清单： <目标目录> <分支> <上游子目录> <仓库地址>
#
# 「目标目录」  = 直接放在仓库根目录的目录名（平铺，不再嵌套）。
# 「上游子目录」= 该包在上游仓库里的位置；写 . 表示整个仓库根目录就是一个包。
#
# ⚠️ 「目标目录」不能随便改：luci-app-tailscale / luci-app-bandix /
#    luci-app-advancedplus / luci-app-poweroffdevice 这几个的包名是靠
#    「目录名」推导出来的，改了会编译出错。
#
# 同一个上游仓库被多个包复用是允许的（例如 easytier 的三个包），
# 同步脚本会按仓库地址缓存，一个仓库只克隆一次。

luci-app-advancedplus   main    .                       https://github.com/sirpdboy/luci-app-advancedplus.git
luci-app-poweroffdevice master  luci-app-poweroffdevice https://github.com/sirpdboy/luci-app-poweroffdevice.git
easytier                main    easytier                https://github.com/EasyTier/luci-app-easytier.git
easytier-noweb          main    easytier-noweb          https://github.com/EasyTier/luci-app-easytier.git
luci-app-easytier       main    luci-app-easytier       https://github.com/EasyTier/luci-app-easytier.git
luci-app-tailscale      main    .                       https://github.com/asvow/luci-app-tailscale.git
luci-app-harbor-file    main    .                       https://github.com/destan19/luci-app-harbor-file.git
luci-app-bandix         main    luci-app-bandix         https://github.com/timsaya/luci-app-bandix.git
openwrt-bandix          main    openwrt-bandix          https://github.com/timsaya/openwrt-bandix.git